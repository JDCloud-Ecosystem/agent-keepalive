name: "Spec Review"
description: "Pedir la revisión de una spec antes de pasar su issue a ready-to-code"
title: "[Spec Review]: "
labels: ["needs-spec"]
body:
  - type: markdown
    attributes:
      value: |
        ## Revisión de spec
        **Regla Spec-First.** La spec tiene que estar aprobada (`status: approved` en su frontmatter)
        antes de escribir código. Esta issue pide esa revisión y esa aprobación.

  - type: input
    id: spec-path
    attributes:
      label: Ruta de la spec
      description: "Ruta exacta del archivo en docs/specs/features/"
      placeholder: "docs/specs/features/21-pause-for-a-day.md"
    validations:
      required: true

  - type: input
    id: related-issue
    attributes:
      label: Issue de funcionalidad relacionada
      description: "Número de la issue que depende de esta spec"
      placeholder: "#21"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist de la spec
      description: "Revisa que la spec cubra estos puntos antes de pedir la revisión"
      options:
        - label: "Visión general clara (qué problema resuelve y para quién)"
        - label: "Objetivos y fuera de alcance definidos"
        - label: "Criterios de aceptación medibles (Dado, Cuando, Entonces)"
        - label: "Comandos, opciones del menú y pantallas que cambian, o «No aplica»"
        - label: "Qué guarda la instalación (configuración, logs, cron, token) y qué cambia, o «Sin cambios»"
        - label: "Qué ve una instalación que actualiza desde la versión anterior"
        - label: "Funciona desde el cron, sin terminal"
        - label: "Textos en español, sin dos puntos ni punto y coma dentro de una oración"
        - label: "Escenarios de prueba completos (feliz, sin red, agente sin sesión, actualización)"
        - label: "Casos límite enumerados por completo, cada uno codificado o descartado con su motivo"
        - label: "Plan de implementación con tareas concretas y archivos afectados"
        - label: "Definition of Done completa"

  - type: textarea
    id: comments
    attributes:
      label: Dudas o ambigüedades
      description: "¿Hay algo en la spec ambiguo, que falte o que haya que discutir antes de aprobarla?"

  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: "Decisiones de diseño tomadas, referencias consultadas, restricciones conocidas"

  - type: markdown
    attributes:
      value: |
        ---
        ## Rama y PR

        No aplica. Una revisión de spec no lleva rama propia, la rama sale de la issue de funcionalidad
        relacionada.

        La convención completa (tipos de rama, flujo y labels) está en https://github.com/JDCloud-Ecosystem/agent-keepalive/blob/main/docs/GITHUB-WORKFLOW.md
